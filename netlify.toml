[build]
  publish = "."

[[redirects]]
  from = "/stories"
  to = "https://elliotroth.substack.com/"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/portfolio/"
  status = 301

[[redirects]]
  from = "/portfolio/websites"
  to = "/portfolio/websites/"
  status = 301

[[redirects]]
  from = "/websites"
  to = "/portfolio/websites/"
  status = 301

# the flat exports are duplicates of the folder URLs
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio/"
  status = 301

[[redirects]]
  from = "/community"
  to = "https://biopunk.community/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
